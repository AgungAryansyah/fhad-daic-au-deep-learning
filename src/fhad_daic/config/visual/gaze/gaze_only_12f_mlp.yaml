experiment_name: "mlp-gaze-only-12f"
tags:
  - mlp
  - functional-features
  - gaze-only
  - hidden-32-16
  - mlp-dropout-0.8
  - 12f

data:
  cleaned_data_root: "data"
  train_dir: "data/train"
  dev_dir: "data/dev"
  checkpoints_dir: "checkpoints"

features:
  include_confidence: true
  confidence_aggregates: true
  confidence:
    - confidence
  include_gaze: true
  gaze:
    - gaze_0_x
    - gaze_0_y
    - gaze_0_z
    - gaze_1_x
    - gaze_1_y
    - gaze_1_z
    - gaze_angle_x
    - gaze_angle_y

scheduler:
  type: "plateau"
  mode: "min"
  factor: 0.5
  patience: 5
  min_lr: 0.000001

mlp:
  hidden_dims: [32, 16]
  dropout: 0.8
  weight_decay: 0.01

training:
  model_type: "functional"
  num_classes: 2
  batch_size: 0
  num_workers: 0
  learning_rate: 0.001
  num_epochs: 200
  early_stopping_patience: 25
  grad_clip_norm: 1.0
  label_smoothing: 0.1
