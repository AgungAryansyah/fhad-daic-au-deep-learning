experiment_name: "egemaps-mil-multiclass"
tags:
  - mil-tcn
  - attention-pooling
  - attn-dim-64
  - channels-32-64-64
  - kernel-7
  - dropout-0.5
  - wd-1e-3
  - lr-5e-5
  - weighted-ce
  - label-smooth-0.1
  - adam
  - plateau
  - grad-clip-1.0
  - w150
  - s75
  - modality-egemaps
  - audio

binning:
  mode: "phq_multiclass"
  bins:
    - {label: 0, name: "minimal", min: 0, max: 4}
    - {label: 1, name: "mild", min: 5, max: 9}
    - {label: 2, name: "moderate", min: 10, max: 14}
    - {label: 3, name: "severe", min: 15, max: 24}

features:
  modality: "egemaps"
  egemaps:
    - Loudness_sma3
    - alphaRatio_sma3
    - hammarbergIndex_sma3
    - slope0-500_sma3
    - slope500-1500_sma3
    - spectralFlux_sma3
    - mfcc1_sma3
    - mfcc2_sma3
    - mfcc3_sma3
    - mfcc4_sma3
    - F0semitoneFrom27.5Hz_sma3nz
    - jitterLocal_sma3nz
    - shimmerLocaldB_sma3nz
    - HNRdBACF_sma3nz
    - logRelF0-H1-H2_sma3nz
    - logRelF0-H1-A3_sma3nz
    - F1frequency_sma3nz
    - F1bandwidth_sma3nz
    - F1amplitudeLogRelF0_sma3nz
    - F2frequency_sma3nz
    - F2amplitudeLogRelF0_sma3nz
    - F3frequency_sma3nz
    - F3amplitudeLogRelF0_sma3nz

data:
  cleaned_data_root: "data"
  train_dir: "data/train"
  dev_dir: "data/dev"
  checkpoints_dir: "checkpoints"

windowing:
  window_size: 150
  stride: 75

scheduler:
  type: "plateau"
  mode: "min"
  factor: 0.5
  patience: 5
  min_lr: 0.000001

mil:
  attn_dim: 64

training:
  model_type: "mil"
  num_classes: 4
  batch_size: 256
  num_workers: 12
  learning_rate: 0.00005
  num_epochs: 100
  early_stopping_patience: 15
  grad_clip_norm: 1.0
  label_smoothing: 0.1

tcn:
  num_channels: [32, 64, 64]
  kernel_size: 7
  dropout: 0.5
  weight_decay: 0.001
