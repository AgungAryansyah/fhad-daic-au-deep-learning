experiment_name: "egemaps-mlp-functional-tiny"
tags:
  - mlp
  - functional-features
  - tiny-model
  - hidden-16
  - mlp-dropout-0.9
  - wd-5e-2
  - lr-1e-3
  - weighted-ce
  - label-smooth-0.1
  - adam
  - plateau
  - grad-clip-1.0
  - no-window
  - modality-egemaps
  - audio

features:
  modality: "egemaps"
  egemaps:
    - Loudness_sma3
    - alphaRatio_sma3
    - hammarbergIndex_sma3
    - slope0-500_sma3
    - slope500-1500_sma3
    - spectralFlux_sma3
    - mfcc1_sma3
    - mfcc2_sma3
    - mfcc3_sma3
    - mfcc4_sma3
    - F0semitoneFrom27.5Hz_sma3nz
    - jitterLocal_sma3nz
    - shimmerLocaldB_sma3nz
    - HNRdBACF_sma3nz
    - logRelF0-H1-H2_sma3nz
    - logRelF0-H1-A3_sma3nz
    - F1frequency_sma3nz
    - F1bandwidth_sma3nz
    - F1amplitudeLogRelF0_sma3nz
    - F2frequency_sma3nz
    - F2amplitudeLogRelF0_sma3nz
    - F3frequency_sma3nz
    - F3amplitudeLogRelF0_sma3nz

data:
  cleaned_data_root: "data"
  train_dir: "data/train"
  dev_dir: "data/dev"
  checkpoints_dir: "checkpoints"

scheduler:
  type: "plateau"
  mode: "min"
  factor: 0.5
  patience: 5
  min_lr: 0.000001

mlp:
  hidden_dims: [16]
  dropout: 0.9
  weight_decay: 0.05

training:
  model_type: "functional"
  num_classes: 2
  batch_size: 0
  num_workers: 0
  learning_rate: 0.001
  num_epochs: 200
  early_stopping_patience: 25
  grad_clip_norm: 1.0
  label_smoothing: 0.1
