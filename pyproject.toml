[project]
name = "fhad-daic-au-deep-learning"
version = "0.1.0"
description = "TCN-based depression detection from facial AU sequences for federated health affective detection research."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.8.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.5.0",
    "shap>=0.46.0",
    "timeshap>=1.0.0",
    "torch>=2.3.0",
    "tqdm>=4.66.0",
    "wandb>=0.17.0",
]

[tool.setuptools.packages.find]
where = ["src"]
